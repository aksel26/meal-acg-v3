<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <title id="title">Meal ACG v3</title>
  <desc id="desc">식대 기록부터 복지포인트·활동비 정산까지 처리하는 사내 복지관리 시스템. 오른쪽 카드는 근무한 날만 식대에 포함해 사용가능액을 계산하는 방식을 보여 준다.</desc>

  <rect width="1200" height="380" rx="28" fill="#f4f4f4"/>

  <g id="title-block">
    <text x="64" y="84" font-size="18" font-weight="600" letter-spacing="2" fill="#505a63">ACG 사내 복지관리 · TURBOREPO MONOREPO</text>
    <text x="64" y="174" font-size="92" font-weight="800" fill="#191c1f" textLength="420" lengthAdjust="spacing">Meal ACG</text>
    <g id="version" transform="translate(502 119)">
      <rect width="76" height="44" rx="22" fill="#494fdf"/>
      <text x="38" y="30" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">v3</text>
    </g>
    <text x="64" y="228" font-size="26" font-weight="500" fill="#505a63">식대 기록부터 복지포인트·활동비 정산까지,</text>
    <text x="64" y="264" font-size="26" font-weight="500" fill="#505a63">사내 복지를 한 곳에서 관리합니다.</text>

    <g id="apps" font-size="20" font-weight="600" fill="#191c1f" text-anchor="middle">
      <rect x="64" y="294" width="216" height="40" rx="20" fill="#ffffff" stroke="#191c1f" stroke-opacity="0.1"/>
      <text x="172" y="321">User · 직원용 PWA</text>
      <rect x="292" y="294" width="264" height="40" rx="20" fill="#ffffff" stroke="#191c1f" stroke-opacity="0.1"/>
      <text x="424" y="321">Admin · 관리자 대시보드</text>
    </g>
  </g>

  <g id="allowance-proof" transform="translate(664 54)">
    <rect width="472" height="272" rx="24" fill="#ffffff" stroke="#191c1f" stroke-opacity="0.1"/>
    <text x="28" y="48" font-size="18" font-weight="600" fill="#505a63">사용가능액 계산</text>

    <g id="week" text-anchor="middle">
      <g fill="#dfe0ff">
        <rect x="28" y="68" width="76" height="100" rx="16"/>
        <rect x="113" y="68" width="76" height="100" rx="16"/>
        <rect x="283" y="68" width="76" height="100" rx="16"/>
      </g>
      <g fill="#f4f4f4">
        <rect x="198" y="68" width="76" height="100" rx="16"/>
        <rect x="368" y="68" width="76" height="100" rx="16"/>
      </g>
      <g font-size="20" font-weight="500" fill="#505a63">
        <text x="66" y="106">월</text>
        <text x="151" y="106">화</text>
        <text x="236" y="106">수</text>
        <text x="321" y="106">목</text>
        <text x="406" y="106">금</text>
      </g>
      <g font-size="22" font-weight="700">
        <text x="66" y="142" fill="#494fdf">근무</text>
        <text x="151" y="142" fill="#494fdf">근무</text>
        <text x="236" y="142" fill="#505a63">재택</text>
        <text x="321" y="142" fill="#494fdf">근무</text>
        <text x="406" y="142" fill="#505a63">연차</text>
      </g>
    </g>

    <text x="28" y="212" font-size="24" font-weight="700" fill="#191c1f">일일단가 × 식대 포함 <tspan fill="#494fdf">3일</tspan></text>
    <text x="28" y="244" font-size="18" font-weight="500" fill="#505a63">재택·연차·개별식사는 계산에서 빠집니다</text>
  </g>
</svg>
